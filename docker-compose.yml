services:
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 + pgvector preinstallato
    environment:
      POSTGRES_USER: lipari
      POSTGRES_PASSWORD: lipari
      POSTGRES_DB: lipari_ai
    ports:
      - "5432:5432"
    volumes:
      - lipari-ai-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
  
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode
    ports:
      - "4096:4096"
    entrypoint: []
    command: ["opencode", "serve", "--print-logs", "--log-level", "DEBUG", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      - ./opencode-config:/root/.config/opencode

volumes:
  lipari-ai-data:
  ollama_data: